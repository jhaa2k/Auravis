name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - run: npm ci
      - run: npm test
      - run: npm run android:build

      - name: Prepare release signing keystore
        if: ${{ env.AURAVIS_KEYSTORE_BASE64 != '' }}
        env:
          AURAVIS_KEYSTORE_BASE64: ${{ secrets.AURAVIS_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$AURAVIS_KEYSTORE_BASE64" | base64 --decode > android/app/auravis-release.jks

      - name: Build signed release APK
        if: ${{ env.AURAVIS_KEYSTORE_BASE64 != '' }}
        env:
          AURAVIS_KEYSTORE_PATH: ${{ github.workspace }}/android/app/auravis-release.jks
          AURAVIS_KEYSTORE_PASSWORD: ${{ secrets.AURAVIS_KEYSTORE_PASSWORD }}
          AURAVIS_KEY_ALIAS: ${{ secrets.AURAVIS_KEY_ALIAS }}
          AURAVIS_KEY_PASSWORD: ${{ secrets.AURAVIS_KEY_PASSWORD }}
        run: cd android && ./gradlew assembleRelease

      - name: Upload signed release APK
        if: ${{ env.AURAVIS_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: auravis-signed-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: auravis-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
